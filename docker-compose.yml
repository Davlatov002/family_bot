services:
  db:
    image: postgres:16
    container_name: family_bot_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Port tashqariga ochilmaydi. Kerak bo'lsa faqat serverning o'zidan:
    # ports:
    #   - "127.0.0.1:5432:5432"

  bot:
    build: .
    container_name: family_bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Konteyner ichida baza "db" servisida joylashgan (.env dagi localhost o'rniga)
      DB_HOST: db
      DB_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/media:/app/backend/media
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
